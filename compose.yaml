services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      POSTGRES_DB: ledger
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ledger -d ledger]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./backend
      secrets: [build_ca]
    environment:
      DATABASE_URL: postgres://ledger:${POSTGRES_PASSWORD:-ledger}@db:5432/ledger?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      STORAGE_DIR: /data/attachments
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /ledger, -healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ./frontend
      secrets: [build_ca]
    ports:
      - "127.0.0.1:${PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  db_data:
  attachments:
secrets:
  build_ca:
    file: ${BUILD_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
